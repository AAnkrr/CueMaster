<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CueMaster 杆大师 · 斯诺克&台球赛事追踪</title>
<style>
:root{--bg:#0D1B16;--sur:#152A20;--card:#1A3328;--green:#1B7A4A;--greenL:#25A85A;--gold:#C8A951;--goldL:#E0C870;--red:#FF4444;--tc:#FF4500;--inv:#4169E1;--china:#C41E3A;--nine:#1E3A8A;--t1:#fff;--t2:#B0B8B1;--t3:#6B736B;--r:16px;--rs:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:8px}
.phone{width:400px;max-width:100vw;height:95vh;max-height:900px;background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,0.6);display:flex;flex-direction:column;position:relative}
.sb{display:flex;justify-content:space-between;padding:14px 26px 6px;font-size:12px;font-weight:600;color:var(--t1);flex-shrink:0}
.nh{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 4px;flex-shrink:0}
.nt{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--t1)}
.ns{cursor:pointer;background:var(--sur);padding:7px 12px;border-radius:20px;border:1px solid var(--greenL);font-size:12px;color:var(--greenL);font-weight:600}
.sp{display:flex;margin:4px 16px;background:var(--sur);border-radius:12px;padding:2px;flex-shrink:0}
.so{flex:1;text-align:center;padding:8px 4px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t2);transition:all .15s}
.so.ac{background:var(--green);color:#fff;font-weight:700}.so .em{font-size:15px;display:block;margin-bottom:1px}
.so.c8.ac{background:var(--china)}.so.n9.ac{background:var(--nine)}
#main{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
#dv{overflow:hidden;min-height:0}
.ct{flex:1;padding:0 16px;overflow-y:auto;min-height:0;scrollbar-width:none;-ms-overflow-style:none}
.ct::-webkit-scrollbar{display:none}
.st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}.st.live{color:var(--red)}.st.up{color:var(--gold)}.st.done{color:var(--t3)}
.tc2{background:var(--sur);border-radius:var(--r);padding:12px;margin-bottom:8px;border-left:4px solid var(--gold);cursor:pointer;transition:transform .12s}
.tc2:active{transform:scale(.985)}.tc2.tc{border-left-color:var(--tc)}.tc2.rk{border-left-color:var(--gold)}.tc2.inv2{border-left-color:var(--inv)}
.tb{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.bd{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.bd.tc{background:var(--tc)22;color:var(--tc)}.bd.rk{background:var(--gold)22;color:var(--gold)}.bd.inv2{background:var(--inv)22;color:var(--inv)}.bd.pr{background:var(--gold)15;color:var(--gold)}
.tn{font-size:14px;font-weight:700;margin-bottom:2px;line-height:1.3;color:var(--t1)}.tl{font-size:11px;color:var(--t2);margin-bottom:5px}
.tf{display:flex;justify-content:space-between;align-items:center;font-size:11px}.td{color:var(--t2)}
.cd{background:var(--green)22;color:var(--greenL);padding:3px 9px;border-radius:20px;font-weight:700;font-size:11px}
.cd.live{background:#ff000018;color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.done{font-size:11px;color:var(--t3)}
.fb{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;flex-shrink:0}.fb::-webkit-scrollbar{display:none}
.fp{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;border:1px solid rgba(255,255,255,.1);color:var(--t2);transition:all .12s}
.fp.ac{background:var(--green)22;border-color:var(--green);color:var(--greenL)}
.sb2{display:flex;align-items:center;background:var(--sur);border-radius:10px;padding:8px 12px;margin-bottom:4px;gap:8px;flex-shrink:0}
.sb2 input{flex:1;background:none;border:none;color:var(--t1);font-size:13px;outline:none}.sb2 input::placeholder{color:var(--t3)}
.rr{display:flex;align-items:center;padding:10px 10px;background:var(--sur);border-radius:8px;margin-bottom:2px;cursor:pointer;transition:background .12s}
.rr:active{background:var(--card)}.rr.t3{background:var(--green)08}
.rn{width:24px;font-weight:700;font-size:13px;text-align:center;flex-shrink:0}
.rn.g1{color:#FFD700}.rn.g2{color:#C0C0C0}.rn.g3{color:#CD7F32}
.av2{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;background:var(--green)18}
.av2 img{width:100%;height:100%;object-fit:cover}
.av2 .avf{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);font-size:13px}
.av2 .flg2{position:absolute;bottom:-3px;right:-3px;font-size:11px;background:var(--bg);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg);z-index:2}
.nc{flex:1;margin-left:8px}.nc .nm{font-size:12px;font-weight:600;color:var(--t1)}.nc .na{font-size:9px;color:var(--t3);margin-top:1px}
.rp{font-size:11px;color:var(--gold);font-weight:600;margin-right:6px}
.rc{font-size:10px;font-weight:700;width:28px;text-align:center}.rc.up{color:#44CC44}.rc.dn{color:var(--red)}.rc.sm{color:var(--t3)}
.sec-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:8px 0 4px 2px}
.mp2{display:flex;align-items:center;margin:4px 16px 4px;padding:8px 12px;background:var(--gold)08;border-radius:var(--rs);border:1px solid var(--gold)25;cursor:pointer;flex-shrink:0}
.mp2 .mpi2{flex:1;margin-left:8px}.mp2 .mpn2{font-size:12px;font-weight:600;color:var(--t1)}.mp2 .mpr2{font-size:10px;color:var(--t2);margin-top:1px}
.mp2 .mppt2{font-size:12px;font-weight:700;color:var(--gold)}.mp2 .cls2{color:var(--t3);margin-left:4px;font-size:10px;cursor:pointer;padding:3px}
.mod{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100}.mod.hidden{display:none}
.mc{background:var(--sur);border-radius:20px;padding:16px;width:290px;max-height:70vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;border:1px solid rgba(255,255,255,.08)}
.mc::-webkit-scrollbar{display:none}
.mct{font-size:16px;font-weight:700;color:var(--t1);text-align:center;margin-bottom:10px}
.mo{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:10px;margin-bottom:2px;cursor:pointer}.mo.ac3{background:var(--green)18}
.mca{text-align:center;padding:10px 0;color:var(--t2);cursor:pointer;font-size:14px;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--greenL);cursor:pointer;padding:8px 16px}
.hero{background:var(--sur);border-radius:var(--r);padding:16px;margin-bottom:12px}.heron{font-size:18px;font-weight:800;color:var(--t1);margin:6px 0}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.ic{background:var(--sur);border-radius:10px;padding:10px;text-align:center}.ic .v2{font-size:16px;font-weight:800;color:var(--t1)}.ic .l2{font-size:9px;color:var(--t3);margin-top:3px}
.br-section{margin-bottom:14px}.br-title{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;padding:5px 10px;background:var(--sur);border-radius:8px;text-align:center}
.br-match{background:var(--sur);border-radius:8px;padding:9px 12px;margin-bottom:3px}
.br-match .br-row{display:flex;align-items:center;justify-content:space-between}
.br-match .br-p{flex:1;font-size:11px;color:var(--t1);display:flex;align-items:center;gap:4px}.br-match .br-p.br-w{font-weight:700}
.br-match .br-p2{flex:1;text-align:right;font-size:11px;color:var(--t1);display:flex;align-items:center;justify-content:flex-end;gap:4px}.br-match .br-p2.br-w{font-weight:700}
.br-score{font-size:14px;font-weight:800;color:var(--t1);padding:0 8px;min-width:44px;text-align:center}.br-score.ls{color:var(--red);animation:pulse 1.5s infinite}
.tab2{display:flex;background:var(--sur);border-top:1px solid rgba(255,255,255,.04);padding:4px 0 16px;flex-shrink:0}
.ti2{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--t3);font-size:10px;padding:4px 0;transition:color .12s}.ti2.ac{color:var(--green)}.ti2 .tii{font-size:19px}
.hidden{display:none!important}

.pf2{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sur);border-radius:var(--r);margin-bottom:14px;cursor:pointer}
.sg{background:var(--sur);border-radius:var(--rs);padding:2px 14px;margin-bottom:12px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}.sr:last-child{border:none}
.srl{font-size:13px;color:var(--t1)}
.tg{width:44px;height:24px;background:var(--green);border-radius:12px;position:relative;cursor:pointer}.tg::after{content:'';position:absolute;top:2px;right:2px;width:20px;height:20px;background:#fff;border-radius:50%}
.prc{background:linear-gradient(135deg,var(--gold)18,var(--sur));border:1px solid var(--gold)35;border-radius:var(--r);padding:12px;margin-bottom:14px}
.prt{font-size:14px;font-weight:800;color:var(--gold);margin-bottom:4px}.prd{font-size:11px;color:var(--t2);margin-bottom:10px;line-height:1.5}
.pl{display:flex;gap:8px}.pl2{flex:1;text-align:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;font-size:12px;color:var(--t2)}
.pl2.rec{background:var(--gold)22;border:1.5px solid var(--gold)}.pl2 .price{font-weight:800;font-size:14px;margin-top:2px;color:var(--gold)}
.rb{background:orange;color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:10px;display:inline-block;margin-bottom:2px}
.cat-sep{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.cat-sep .line{flex:1;height:1px;background:rgba(255,255,255,.08)}
.cat-sep .lbl{font-size:10px;color:var(--t3);font-weight:600;white-space:nowrap}
/* new: match time & reminders */
.mt2{font-size:10px;color:var(--gold);font-weight:600;background:var(--gold)12;padding:2px 8px;border-radius:10px;display:inline-block;margin-left:4px}
.pro-badge{background:linear-gradient(135deg,#C8A951,#E0C870);color:#000;font-size:8px;font-weight:800;padding:2px 7px;border-radius:10px;display:inline-block;letter-spacing:.5px}
.pro-lock{color:var(--gold);font-size:10px;cursor:pointer;opacity:.7}
.upcoming-section{margin-bottom:14px}
.upcoming-header{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.upcoming-match{background:var(--sur);border-radius:10px;padding:10px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .12s}
.upcoming-match:active{background:var(--card)}
.upcoming-match .um-info{flex:1;min-width:0}
.upcoming-match .um-name{font-size:11px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upcoming-match .um-meta{font-size:9px;color:var(--t3);margin-top:2px}
.upcoming-match .um-time{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.reminder-btn2{background:var(--green)18;border:1px solid var(--green)30;border-radius:16px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--greenL);cursor:pointer;white-space:nowrap;transition:all .12s}
.reminder-btn2:active{background:var(--green)30}
.reminder-btn2.pro-gated{background:var(--gold)10;border-color:var(--gold)25;color:var(--gold)}
.reminder-btn2.set{background:var(--green);color:#fff;border-color:var(--green)}
.api-status{font-size:9px;padding:3px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px}
.api-status.online{background:var(--green)15;color:var(--greenL)}.api-status.offline{background:var(--gold)15;color:var(--gold)}
.pro-section{background:linear-gradient(135deg,var(--gold)10,var(--sur));border:1px solid var(--gold)25;border-radius:var(--r);padding:14px;margin-bottom:12px}
.pro-section .pro-title{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px}
.pro-section .pro-desc{font-size:10px;color:var(--t2);margin-bottom:10px;line-height:1.5}
.pro-features{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.pro-feat{font-size:9px;padding:3px 8px;border-radius:10px;background:var(--gold)10;color:var(--gold);white-space:nowrap}
.pro-feat.free{background:var(--t3)15;color:var(--t2);text-decoration:line-through}
.rem-stats{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--t2)}
.rem-stats .rem-used{font-weight:700;color:var(--gold)}
.data-refresh{font-size:9px;color:var(--t3);text-align:center;padding:4px 0;cursor:pointer}
/* widget mockup gallery */
.wg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.wc{border-radius:20px;padding:14px;position:relative;overflow:hidden;cursor:default;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.wc:active{transform:scale(.97)}
.wc .wh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wc .wi{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.wc .wn{font-size:9px;font-weight:600;opacity:.7}
.wc .wv{font-size:26px;font-weight:800;margin:4px 0}
.wc .ws{font-size:9px;opacity:.6}
.wc .lock-overlay{position:absolute;top:0;left:0;right:0;bottom:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;z-index:2;border-radius:20px}
.wc .lock-icon{font-size:22px}.wc .lock-text{font-size:10px;font-weight:700;color:#fff}
/* theme: classic green */
.wc.th-green{background:linear-gradient(145deg,#0D2B1D,#153A28);border:1px solid rgba(27,122,74,.3);color:#e0e0e0}
.wc.th-green .wi{background:#1B7A4A;color:#fff}.wc.th-green .wv{color:#25A85A}
/* theme: midnight */
.wc.th-midnight{background:linear-gradient(145deg,#0a0a0a,#1a1a1a);border:1px solid rgba(255,255,255,.08);color:#ccc}
.wc.th-midnight .wi{background:#333;color:#fff}.wc.th-midnight .wv{color:#fff}
/* theme: gold */
.wc.th-gold{background:linear-gradient(145deg,#1a180a,#2a2410);border:1px solid rgba(200,169,81,.3);color:#ddd}
.wc.th-gold .wi{background:linear-gradient(135deg,#C8A951,#E0C870);color:#1a1a0a}.wc.th-gold .wv{color:#E0C870}
/* theme: orange */
.wc.th-orange{background:linear-gradient(145deg,#1a0f08,#2a1810);border:1px solid rgba(255,107,53,.3);color:#eee}
.wc.th-orange .wi{background:linear-gradient(135deg,#FF6B35,#FF8C5A);color:#fff}.wc.th-orange .wv{color:#FF6B35}
/* theme: white */
.wc.th-white{background:linear-gradient(145deg,#f0f0f0,#e8e8e8);border:1px solid rgba(0,0,0,.06);color:#1a1a1a}
.wc.th-white .wi{background:#333;color:#fff}.wc.th-white .wv{color:#000}.wc.th-white .wn{opacity:.5}.wc.th-white .ws{opacity:.4}
/* theme: ocean */
.wc.th-ocean{background:linear-gradient(145deg,#0a1628,#0d1f3c);border:1px solid rgba(30,58,138,.4);color:#d0d8f0}
.wc.th-ocean .wi{background:linear-gradient(135deg,#1E3A8A,#3B82F6);color:#fff}.wc.th-ocean .wv{color:#60A5FA}
/* theme: lavender */
.wc.th-lavender{background:linear-gradient(145deg,#0f0a1a,#1a1030);border:1px solid rgba(124,58,237,.3);color:#e0d8f0}
.wc.th-lavender .wi{background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff}.wc.th-lavender .wv{color:#A78BFA}
/* theme: china red */
.wc.th-red{background:linear-gradient(145deg,#1a0a0a,#2a1015);border:1px solid rgba(196,30,58,.4);color:#f0d0d0}
.wc.th-red .wi{background:linear-gradient(135deg,#C41E3A,#E04050);color:#FFD700}.wc.th-red .wv{color:#FFD700}
.wg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wg-header .wgh-t{font-size:12px;font-weight:700;color:var(--t1)}
.wg-tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:14px;flex-shrink:0}
.wg-tabs::-webkit-scrollbar{display:none}
.wg-tab{padding:8px 14px;border-radius:18px;font-size:10px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid rgba(255,255,255,.08);color:var(--t2);transition:all .12s}
.wg-tab.ac{background:var(--green)22;border-color:var(--green);color:var(--greenL)}
.wg-desc{font-size:10px;color:var(--t3);text-align:center;padding:6px 0;line-height:1.5}
.wg-compare{display:flex;gap:10px;margin:12px 0}
.wg-compare>div{flex:1;border-radius:16px;padding:12px;text-align:center}
.wg-compare .free-side{background:var(--sur);border:1px solid rgba(255,255,255,.06)}
.wg-compare .pro-side{background:linear-gradient(135deg,var(--gold)10,var(--sur));border:1px solid var(--gold)30}
.wg-compare .side-label{font-size:9px;font-weight:700;margin-bottom:6px}
.wg-compare .side-label.free{color:var(--t3)}.wg-compare .side-label.pro{color:var(--gold)}
.wg-compare .side-item{font-size:9px;padding:3px 0;color:var(--t2)}
</style>
</head>
<body>
<div class="phone" id="app">
<div class="sb"><span>9:41</span><span>📶 🔋 91%</span></div>
<div id="main">
<div class="nh"><span class="nt" id="pt">赛程</span><span class="ns" id="ssbtn" onclick="toggleSeason()">2026/27 ▾</span></div>
<div class="sp" id="sp">
  <div class="so ac" data-s="snooker" onclick="selSport('snooker')"><span class="em">🎱</span>斯诺克</div>
  <div class="so" data-s="chinese8" onclick="selSport('chinese8')"><span class="em">🔴</span>中式八球</div>
  <div class="so" data-s="nineball" onclick="selSport('nineball')"><span class="em">🔵</span>九球</div>

</div>

</div>

</div>
</div>

<script>

// ====== API SERVICE ======
const APIService={
  baseURL:'https://api.allorigins.win/raw?url='+encodeURIComponent('http://api.snooker.org/'),
  async fetch(endpoint,cacheKey,cacheDuration){
    const fullKey='cuemaster_api_'+cacheKey;
    if(cacheKey){
      const cached=localStorage.getItem(fullKey);
      if(cached){try{const d=JSON.parse(cached);if(Date.now()-d.ts<(cacheDuration||3600000)){return d.data}}catch(e){}}
    }
    try{
      const resp=await fetch(this.baseURL+endpoint,{signal:AbortSignal.timeout(8000)});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const text=await resp.text();
      let data=null;
      try{data=JSON.parse(text)}catch(e){/* XML or other format */}
      if(cacheKey&&data){localStorage.setItem(fullKey,JSON.stringify({ts:Date.now(),data}))}
      return data;
    }catch(e){/* fall through to mock */}
    if(cacheKey){const stale=localStorage.getItem(fullKey);if(stale){try{return JSON.parse(stale).data}catch(e){}}}
    return null;
  },
  async getSchedule(season){
    const sYear=parseInt(season.split('/')[0]);
    return await this.fetch('?t=5&s='+sYear,'schedule_'+sYear,6*3600000);
  },
  async getRankings(season){
    const sYear=parseInt(season.split('/')[0]);
    return await this.fetch('?rt=MoneyRankings&s='+sYear,'rankings_'+sYear,3600000);
  },
  async getLiveMatches(){
    return await this.fetch('?t=4','live_matches',60000);
  }
};

// ---- Remote data URL (set after GitHub/Vercel deployment) ----
const REMOTE_DATA_URL='https://raw.githubusercontent.com/AAnkrr/CueMaster/main/data/output/snooker-data.json';

async function refreshAPIData(){
  // Strategy 1: try to load generated data file (local or via remote fetch)
  try{
    let remoteData=null;
    // If the local data file already loaded with real data, skip fetch
    const localD=window.__SNOOKER_API_DATA__;
    if(localD&&localD.source&&localD.source!=='mock-initial'&&localD.source!=='mock'){apiOnline=true;apiLastUpdate=localD.generated;return true}
    // Try remote fetch (GitHub/Vercel)
    if(REMOTE_DATA_URL&&!REMOTE_DATA_URL.includes('YOUR_USERNAME')){
      const resp=await fetch(REMOTE_DATA_URL,{signal:AbortSignal.timeout(10000)});
      if(resp.ok){const data=await resp.json();window.__SNOOKER_API_DATA__=data;apiOnline=true;apiLastUpdate=data.generated||new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return true}
    }
  }catch(e){/* fall through */}
  // Strategy 2: try api.snooker.org directly (works from non-China IPs)
  try{
    const sched=await APIService.getSchedule(curSeason);
    const ranks=await APIService.getRankings(curSeason);
    const live=await APIService.getLiveMatches();
    if(sched||ranks||live){apiOnline=true;apiLastUpdate=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return true}
  }catch(e){}
  apiOnline=false;return false;
}

function getApiStatusHtml(){
  const d=window.__SNOOKER_API_DATA__;
  const hasFresh=d&&d.source&&d.source!=='mock-initial'&&d.source!=='mock';
  if(hasFresh){return`<span class="api-status online" title="数据更新于 ${d.generated||'?'}">🟢 实时数据 (${d.source})</span>`}
  if(apiOnline)return`<span class="api-status online" title="API 最后更新: ${apiLastUpdate||'刚刚'}">🟢 实时数据</span>`;
  return`<span class="api-status offline" title="使用内置 mock 数据&#10;api.snooker.org 从大陆 IP 被拦截&#10;部署 Vercel 可获取实时数据" style="cursor:default">🟡 离线数据</span>`;
}

}

function showPlayerDetail(id){
  let p=null;Object.values(SP).forEach(pl=>{const f=pl.find(x=>x.id===id);if(f)p=f});
  if(!p)return;const rk=p.rk||0;
  // Build upcoming matches list
  const playerTids=getPlayerTournaments(id);
  const allT=allTournaments();
  const upcomingMatches=[];
  playerTids.forEach(tid=>{
    const t=allT.find(x=>x.id===tid);
    if(t&&(t.st==='upcoming'||t.st==='live')){
      // Find opponent from bracket if available
      let opponent=null;let matchTime=t.matchTime||null;
      const bracket=BRACKETS[tid];
      if(bracket){bracket.rounds.forEach(rnd=>{rnd.matches.forEach(m=>{if((m.p1===id||m.p2===id)&&(m.status==='upcoming'||m.status==='live')){const oid=m.p1===id?m.p2:m.p1;opponent=findPlayer(oid);if(m.time)matchTime=m.time;}})});}
      upcomingMatches.push({t,matchTime,opponent});
    }
  });
  // Sort by date
  upcomingMatches.sort((a,b)=>new Date(a.t.s)-new Date(b.t.s));
  // Build upcoming HTML
  let upcomingHtml='';
  if(upcomingMatches.length>0){
    upcomingHtml='<div class="upcoming-section"><div class="upcoming-header">📅 即将到来的比赛 <span style="font-size:9px;color:var(--t3);font-weight:400">'+upcomingMatches.length+'场</span></div>';
    upcomingMatches.forEach(um=>{
      const t=um.t;const days=gd(t.s);
      const stLabel=t.st==='live'?'● 进行中':(days>0?days+'天后':'即将开始');
      const oppHtml=um.opponent?`<span style="color:var(--t3)"> vs </span>${um.opponent.f} ${um.opponent.n}`:'';
      const isSet=isReminderSet(t.id);
      const canSet=canSetReminder()||isSet;
      const btnClass=isSet?'reminder-btn2 set':(canSet?'reminder-btn2':'reminder-btn2 pro-gated');
      upcomingHtml+=`<div class="upcoming-match" onclick="showTD('${t.id}')">
        <div style="font-size:18px;flex-shrink:0">🏆</div>
        <div class="um-info"><div class="um-name">${t.n}${oppHtml}</div><div class="um-meta">📍 ${t.ci}, ${t.co} · ${fd(t.s)} · ${stLabel}</div></div>
        ${um.matchTime?`<div class="um-time">${um.matchTime}</div>`:''}
        <span class="${btnClass}" onclick="event.stopPropagation();${canSet?`setReminder('${t.id}','${t.n}','${t.s}','${um.matchTime||''}')`:`togglePro()`}" title="${isSet?'取消提醒':canSet?'设置提醒':'Pro 专属功能'}">${isSet?'✅ 已提醒':canSet?'🔔 提醒':'🔒 Pro'}</span>
      </div>`;
    });
    upcomingHtml+='</div>';
  }
  document.getElementById('dc').innerHTML=`
    <div style="text-align:center;padding:20px;background:var(--sur);border-radius:var(--r);margin-bottom:12px">
      ${avHtml(p,60)}<div style="margin-top:8px"></div>
      <div style="font-size:18px;font-weight:800;color:var(--t1)">${p.n}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">${p.z}</div>
      <div style="font-size:16px;margin-top:4px">${p.f} ${p.na}</div>
      ${rk?`<div style="margin-top:8px;display:inline-block;padding:5px 14px;background:var(--gold)15;border-radius:20px;color:var(--gold);font-weight:700;font-size:12px">🏆 世界第 ${rk} 位</div>`:''}
    </div>
    ${upcomingHtml}
    <div class="ig"><div class="ic"><div class="v2" style="color:var(--greenL)">No.${rk||'-'}</div><div class="l2">当前排名</div></div><div class="ic"><div class="v2">${fmtPts(p.pt,p.sp||curSport)}</div><div class="l2">积分/奖金</div></div><div class="ic"><div class="v2">${p.tp}</div><div class="l2">转职业</div></div></div>
    <div style="background:var(--sur);border-radius:10px;padding:12px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:8px;color:var(--t1)">2025/26 赛季数据</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><div class="ic"><div class="v2">${50+rk}</div><div class="l2">参赛</div></div><div class="ic"><div class="v2">${35+rk}</div><div class="l2">胜场</div></div><div class="ic"><div class="v2">${60+Math.floor(Math.random()*20)}%</div><div class="l2">胜率</div></div><div class="ic"><div class="v2">${40+rk*2}</div><div class="l2">破百</div></div><div class="ic"><div class="v2">${rk===3?'147 🔥':(130+Math.floor(Math.random()*16))}</div><div class="l2">最高分</div></div><div class="ic"><div class="v2">${fmtPts(p.pt,p.sp||curSport)}</div><div class="l2">赛季奖金</div></div></div></div>
    <div style="font-weight:700;margin-bottom:6px;color:var(--t1)">🏅 荣誉殿堂</div>
    <div style="background:var(--sur);border-radius:10px;padding:10px;margin-bottom:12px">
      ${(ACHIEVEMENTS[id]||[]).length>0?ACHIEVEMENTS[id].map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="font-size:10px;color:var(--gold);font-weight:700;min-width:36px">${a.y}</span><span style="font-size:11px;color:var(--t1)">${a.t}</span></div>`).join(''):'<div style="text-align:center;padding:10px;color:var(--t3);font-size:11px">暂无荣誉记录</div>'}
    </div>
    <div style="font-weight:700;margin-bottom:6px;color:var(--t1)">近期比赛</div>
    <div style="background:var(--sur);border-radius:8px;padding:10px;margin-bottom:5px;display:flex;align-items:center;gap:8px"><span style="color:#44CC44;font-weight:700;font-size:12px">●</span><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--t1)">世锦赛 半决赛</div><div style="font-size:9px;color:var(--t3)">vs N.Robertson</div></div><span style="font-weight:700;color:#44CC44;font-size:11px">17 - 12</span><span style="font-size:9px;color:var(--t3)">5/2</span></div>
    <div style="background:var(--sur);border-radius:8px;padding:10px;margin-bottom:5px;display:flex;align-items:center;gap:8px"><span style="color:var(--red);font-weight:700;font-size:12px">●</span><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--t1)">世锦赛 决赛</div><div style="font-size:9px;color:var(--t3)">vs J.Trump</div></div><span style="font-weight:700;color:var(--red);font-size:11px">15 - 18</span><span style="font-size:9px;color:var(--t3)">5/4</span></div>
  `;
  document.getElementById('main').classList.add('hidden');document.getElementById('dv').classList.remove('hidden');
  document.getElementById('tab').classList.add('hidden');document.getElementById('sp').classList.add('hidden');document.getElementById('ssbtn').classList.add('hidden');
}

// ====== INIT ======
loadMP();
let sh='';SEASONS.forEach(s=>{sh+=`<div class="sm2${s===curSeason?' ac3':''}" onclick="selSeason('${s}')"><span style="font-size:14px;color:var(--t2)">${s} 赛季</span>${s===curSeason?'<span style="color:var(--greenL);font-size:15px">✓</span>':''}</div>`});
document.getElementById('sl').innerHTML=sh;
renderMain();
// Background: try to connect to snooker.org API (fails gracefully)
setTimeout(()=>{refreshAPIData().then(ok=>{if(ok&&curTab==='schedule')renderMain()})},2000);
</script>
