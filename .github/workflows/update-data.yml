name: Update Snooker Data

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch snooker data
        working-directory: ./data
        run: node fetch-snooker.js
      - name: Commit and push
        run: |
          git config user.name "CueMaster Bot"
          git config user.email "bot@cuemaster.app"
          git add data/output/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update [skip ci]"
            git push
          fi
